---
layout: default
---
<article class="tagebuch-eintrag">
  <header>
    <h1>{{ page.title }}</h1>
    {% if page.date %}
      <p class="eintrag-datum">{{ page.date | date: "%d.%m.%Y" }}</p>
    {% endif %}
  </header>

  {{ content }}

  <p><a href="{{ '/' | relative_url }}">&larr; Zurück zur Übersicht</a></p>
</article>
